# Profile and timing overrides. Unlisted fields keep the preset's (or the default) value.

# A new profile: gentle S-curves with a long homing phase, for small interface targets.
profile.interface.path = bezier
profile.interface.bezier-degree = 5
profile.interface.curvature = 0.06
profile.interface.peak = 0.35
profile.interface.sharpness = 9
profile.interface.endpoint-spread = 0.2
profile.interface.overshoot-chance = 0

# Override one field of a built-in preset.
profile.fast.fitts-b = 0.09

# Timing profile overrides (kind: fixed | uniform | gaussian | lognormal).
timing.key.gap.center = 0.11
timing.action.reaction.max = 0.9
